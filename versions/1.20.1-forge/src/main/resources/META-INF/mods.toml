modLoader="javafml"
loaderVersion="[47,)"
license="GPL-3.0-only"
issueTrackerURL=""

[[mods]]
modId="dangomusic_cityechoes"
version="${version}"
displayName="City Echoes in DangoMusic"
authors="CityEchoes Addon"
displayURL=""
clientSideOnly=true
description='''
City Echoes lyric performance for Dango Music, shipped as a decoupled addon mod.
Depends on DangoMusic (me.sorihiko.dango:dangomusic).
'''

[[dependencies.dangomusic_cityechoes]]
modId="dangomusic"
mandatory=true
versionRange="[1.7.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.dangomusic_cityechoes]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="CLIENT"

[[dependencies.dangomusic_cityechoes]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="CLIENT"

